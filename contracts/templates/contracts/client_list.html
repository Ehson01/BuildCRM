<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Clients</title>
</head>
<body>
    <h1>Clients</h1>
    <p>
        <a href="{% url 'contracts:client_create' %}">+ New client</a> |
        <a href="{% url 'contracts:contract_list' %}">Contracts</a> |
        <a href="{% url 'leads:list' %}">Leads</a>
    </p>

    <table border="1" cellpadding="6" cellspacing="0">
        <thead>
            <tr>
                <th>ID</th>
                <th>Full Name</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Address</th>
                <th>Details</th>
            </tr>
        </thead>
        <tbody>
            {% for client in clients %}
            <tr>
                <td>{{ client.id }}</td>
                <td>{{ client.full_name }}</td>
                <td>{{ client.phone }}</td>
                <td>{{ client.email }}</td>
                <td>{{ client.address }}</td>
                <td><a href="{% url 'contracts:client_detail' client.pk %}">Open</a></td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="6">No clients yet.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
