<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Set New Password</title>
</head>
<body>
    <h1>Set New Password</h1>

    {% if validlink %}
        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">Change Password</button>
        </form>
    {% else %}
        <p>This password reset link is invalid or has expired.</p>
    {% endif %}

    <a href="{% url 'login' %}">Back to Login</a>
</body>
</html>
