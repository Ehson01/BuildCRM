{% extends "base.html" %}

{% block title %}Email Sent · BuildCRM{% endblock %}

{% block content %}
<div class="card auth-card" style="text-align: center;">
    <div class="card-body" style="padding: 36px 24px;">
        <div style="font-size: 42px; margin-bottom: 16px;">✉️</div>
        <h2 style="font-size: 22px; margin-bottom: 12px;">Check Your Email</h2>
        <p class="text-muted" style="margin-bottom: 24px;">If an account exists with the email you entered, we have sent instructions to reset your password.</p>
        <a href="{% url 'login' %}" class="btn btn-primary">Back to Sign In</a>
    </div>
</div>
{% endblock %}
